<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieDB - Register</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script type="text/javascript" src="script.js"></script>
</head>
<body class="bg-register">
    
    <header class="navbar">
        <div class="nav-left">
            <h1 class="logo-text">MovieDB</h1>
        </div>
        <div class="nav-center">
            <input type="text" class="search-bar" placeholder="Search Movies">
        </div>
            <button type="button" class="btn-black" onclick="window.location.href='index.html'">Login</button>
        </div>
        <div class="clear"></div>
    </header>
    
    <main class="register-box">
        <h1 align="center" class="title-register">Reset Password</h1>
        <form id="registerForm" name="formRegister">
             <p class="form-label-reg">New Password</p>
            <input type="password" id="regPass" class="input-field-reg" required>
            
            <p class="form-label-reg">Password</p>
            <input type="password" id="regPass" class="input-field-reg" required>
            
            <div align="center" style="margin-top: 40px;">
                <button type="button" class="btn-teal" onclick="doRegister()" style="font-size: 20px; font-weight: bold; color: white;">Confirm</button>
                <p class="login-link-text">
                    <b><a href="index.html">Confirm</a></b>
                </p>
            </div>
        </form>
    </main>
</body>
</html>
